<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <title>Contacto - Tienda TBR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body>
    <div class="grid-container">
<!--------- HEADER ---------->
        <header class="header">
            <h1 class="header__title">Tienda de libros TBR</h1>

            <nav class="flex-nav">
                <ul class="nav__list">
                    <li class="nav__item"><a class="nav__link" href="Index.html">Inicio</a></li>
                    <li class="nav__item"><a class="nav__link" href="productos.html">Productos</a></li>
                    <li class="nav__item"><a class="nav__link" href="contacto.html">Contacto</a></li>
                </ul>
            </nav>

            <ul class="header__actions">
                    <li class="nav__item"><a class="nav__link" href="#"><i class="fa-solid fa-user"></i>Mi cuenta</a></li>
                    <li class="nav__item"><a class="nav__link" href="#"><i class="fa-solid fa-cart-shopping"></i>Carrito</a></li>
            </ul>

        </header>

        <main>
            <section class="contact">
                <h3 class="contact__title">Contactanos</h3>
                <form class="contact__form" action="https://formspree.io/f/xzebgrqb" method="post">
                    <label class="contact__label" for="nombre">Nombre:</label>
                    <input class="contact__input" type="text" id="nombre" name="nombre" required> <!-- El id sirve para una identificación dentro del código. Name sirve para el servidor como identificación cuando se envían los datos. -->
                    <label class="contact__label" for="correo">Correo Electrónico:</label>
                    <input class="contact__input" type="email" id="correo" name="correo" required>
                    <label class="contact__label" for="mensaje">Mensaje:</label>
                    <textarea class="contact__textarea" id="mensaje" name="mensaje" required></textarea>
                    <button class="contact__button" type="submit">Enviar</button>
                </form>
            </section>
            
        </main>

        <footer class="footer">
            <ul class="footer__list">
                <li class="footer__item"><a class="footer__link" href="contacto.html">Contacto</a></li>
                <li class="footer__item"><a class="footer__link" href="#">Preguntas frecuentes</a></li>
                <li class="footer__item"><a class="footer__link" href="#">Sobre nosotros</a></li>
                <li class="footer__item"><p class="footer__text">© 2026 Tienda TBR. Todos los derechos reservados.</p></li>
            </ul>

            <ul class="footer__social">
                <li class="footer__item footer__item--network"><p class="footer__network">@TiendaTBR</p></li>
                <li class="footer__item"><a class="footer__link" href="#"><i class="fa-brands fa-instagram"></i></a></li>
                <li class="footer__item"><a class="footer__link" href="#"><i class="fa-brands fa-twitter"></i></a></li>
                <li class="footer__item"><a class="footer__link" href="#"><i class="fa-brands fa-facebook"></i></a></li>
                <li class="footer__item"><a class="footer__link" href="#"><i class="fa-brands fa-tiktok"></i></a></li>
            </ul>
        </footer>
    </div>
    
</body>
</html>
